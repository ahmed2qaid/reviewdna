name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark
      - run: npm run demo:site
      - run: npm run docs:verify
      - run: npm run example:programmatic
      - run: npm run example:plugin
      - run: npm run release:verify
      - uses: actions/upload-artifact@v4
        with:
          name: reviewdna-demo-node-${{ matrix.node }}
          path: |
            demo-output/
            _site/
            _docs/
            example-output/
            plugin-example-output/

  large-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run benchmark:large
      - uses: actions/upload-artifact@v4
        with:
          name: reviewdna-large-benchmark
          path: benchmark-output/large-repository.json

  cross-platform-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run e2e:smoke

  action-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          repository: ${{ github.repository }}
          max-prs: '5'
          artifact-name: reviewdna-action-smoke

  released-action-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Smoke-test immutable v0.2.0 Action release
        uses: ahmed2qaid/reviewdna/action@v0.2.0
        with:
          repository: ${{ github.repository }}
          max-prs: '5'
          artifact-name: reviewdna-v0.2.0-smoke

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t reviewdna:test .
      - name: Smoke-test Docker CLI
        run: docker run --rm reviewdna:test --version
