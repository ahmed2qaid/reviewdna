name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
      - uses: actions/upload-artifact@v4
        with:
          name: reviewdna-demo-node-${{ matrix.node }}
          path: demo-output/
