name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark
      - run: npm run demo:site
      - run: npm run release:verify
      - uses: actions/upload-artifact@v4
        with:
          name: reviewdna-demo-node-${{ matrix.node }}
          path: |
            demo-output/
            _site/
  action-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          repository: ${{ github.repository }}
          max-prs: '5'
          artifact-name: reviewdna-action-smoke
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t reviewdna:test .
      - name: Smoke-test Docker CLI
        run: docker run --rm reviewdna:test --version
