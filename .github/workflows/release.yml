name: ReviewDNA Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: reviewdna-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark
      - run: npm run demo:site
      - run: npm run docs:verify
      - run: npm run release:verify

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reviewdna" >> "$GITHUB_OUTPUT"

      - name: Check immutable release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            EXISTING_SHA="$(git rev-list -n 1 "$TAG")"
            if [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo "Release $TAG already points to $EXISTING_SHA, not $GITHUB_SHA. Refusing to mutate an immutable release." >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists on this commit; publication steps will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.state.outputs.exists != 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build release container
        if: steps.state.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:latest" \
            .

      - name: Publish release container
        if: steps.state.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Pull and smoke-test published container
        if: steps.state.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker image rm "$IMAGE:$TAG" "$IMAGE:latest" || true
          docker pull "$IMAGE:$TAG"
          docker run --rm "$IMAGE:$TAG" --version

      - name: Create immutable GitHub release
        if: steps.state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ReviewDNA $TAG" \
            --notes-file "releases/${VERSION}.md"
