name: Capture ReviewDNA Showcase

on:
  push:
    branches:
      - feat/real-dashboard-showcase

permissions:
  contents: write

jobs:
  capture:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/real-dashboard-showcase

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the real synthetic demo artifact
        run: |
          npm install --ignore-scripts
          npm run demo:site

      - name: Install browser for deterministic screenshot
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Capture dashboard screenshot
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const { chromium } = require('playwright');

          (async () => {
            const html = readFileSync('_site/index.html', 'utf8');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1100 },
              deviceScaleFactor: 1,
            });
            await page.setContent(html, { waitUntil: 'domcontentloaded' });
            await page.screenshot({
              path: 'docs/assets/reviewdna-dashboard.jpg',
              type: 'jpeg',
              quality: 82,
              fullPage: false,
            });
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Surface the real dashboard in README
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          anchor = "The fixture is synthetic and exists only to demonstrate the product safely. A real repository analysis uses the same engine.\n\n### Example result"
          replacement = """The fixture is synthetic and exists only to demonstrate the product safely. A real repository analysis uses the same engine.

### Real dashboard preview

![ReviewDNA dashboard — synthetic public demo](docs/assets/reviewdna-dashboard.jpg)

> Real screenshot generated from the reproducible ReviewDNA public-demo artifact. The underlying reviews are synthetic example data, not real repository policy.

### Example result"""
          if anchor not in text:
              raise SystemExit('README showcase anchor was not found')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Commit generated showcase assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/assets/reviewdna-dashboard.jpg
          if git diff --cached --quiet; then
            echo "No showcase changes to commit."
            exit 0
          fi
          git commit -m "docs: add real dashboard screenshot"
          git push origin HEAD:feat/real-dashboard-showcase
