name: ReviewDNA Analyze
description: Mine code-review history into evidence-backed engineering rules.
inputs:
  repository:
    description: Target repository in owner/name form
    required: true
  mode:
    description: Run a one-time analysis or compare against a cached watch baseline
    required: false
    default: analyze
  max-prs:
    description: Maximum merged pull requests to scan
    required: false
    default: '100'
  min-evidence:
    description: Minimum review evidence required before promoting a convention
    required: false
    default: '2'
  output:
    description: Output directory
    required: false
    default: reviewdna-output
  redact:
    description: Pseudonymize reviewer names and paths in generated artifacts
    required: false
    default: 'false'
  redact-sensitive:
    description: Selectively scrub common secrets and PII while preserving surrounding prose
    required: false
    default: 'false'
  use-cache:
    description: Reuse PR collection data and watch baselines across workflow runs
    required: false
    default: 'true'
  resume:
    description: Reuse a matching persisted pipeline checkpoint when available
    required: false
    default: 'false'
  use-checkpoints:
    description: Persist resumable pipeline checkpoints when raw persistence is allowed
    required: false
    default: 'true'
  deep-evidence:
    description: Compare reviewed commits with merged PR heads to strengthen accepted-change evidence (uses more API calls)
    required: false
    default: 'false'
  clusterer:
    description: 'Rule clustering mode: deterministic or semantic'
    required: false
    default: deterministic
  semantic-docs:
    description: Add semantic documentation coverage/drift matching on top of lexical matching
    required: false
    default: 'false'
  embedding-provider:
    description: 'Embedding provider for semantic clustering/docs: local, ollama, or openai-compatible'
    required: false
    default: local
  embedding-model:
    description: Embedding model name for model-based providers
    required: false
    default: ''
  embedding-url:
    description: Base URL for Ollama or OpenAI-compatible embeddings
    required: false
    default: ''
  semantic-threshold:
    description: Optional semantic clustering similarity threshold
    required: false
    default: ''
  documentation-semantic-threshold:
    description: Optional semantic documentation similarity threshold
    required: false
    default: ''
  estimate-cost:
    description: Emit token and user-priced cost estimates for optional AI stages
    required: false
    default: 'false'
  embedding-input-price-per-million:
    description: User-supplied embedding input price per one million tokens
    required: false
    default: ''
  llm-input-price-per-million:
    description: User-supplied LLM input price per one million tokens
    required: false
    default: ''
  llm-output-price-per-million:
    description: User-supplied LLM output price per one million tokens
    required: false
    default: ''
  max-remote-cost-usd:
    description: Maximum estimated aggregate cost allowed before remote stages execute
    required: false
    default: ''
  fail-on-changes:
    description: In watch mode, return a non-zero status when conventions change
    required: false
    default: 'false'
  artifact-name:
    description: Uploaded artifact name
    required: false
    default: reviewdna-report
outputs:
  report-path:
    description: Path to the generated HTML report
    value: ${{ inputs.output }}/reviewdna-report.html
  delta-path:
    description: Path to the watch delta report when mode=watch
    value: ${{ inputs.output }}/reviewdna-delta.md
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Restore ReviewDNA cache
      if: ${{ inputs.use-cache == 'true' }}
      uses: actions/cache@v4
      with:
        path: .reviewdna
        key: ${{ runner.os }}-reviewdna-${{ inputs.repository }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-reviewdna-${{ inputs.repository }}-
    - name: Build ReviewDNA
      shell: bash
      run: npm install --ignore-scripts && npm run build
      working-directory: ${{ github.action_path }}/..
    - name: Analyze repository
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RDNA_REPOSITORY: ${{ inputs.repository }}
        RDNA_MODE: ${{ inputs.mode }}
        RDNA_MAX_PRS: ${{ inputs.max-prs }}
        RDNA_MIN_EVIDENCE: ${{ inputs.min-evidence }}
        RDNA_OUTPUT: ${{ inputs.output }}
        RDNA_REDACT: ${{ inputs.redact }}
        RDNA_REDACT_SENSITIVE: ${{ inputs.redact-sensitive }}
        RDNA_USE_CACHE: ${{ inputs.use-cache }}
        RDNA_RESUME: ${{ inputs.resume }}
        RDNA_USE_CHECKPOINTS: ${{ inputs.use-checkpoints }}
        RDNA_DEEP_EVIDENCE: ${{ inputs.deep-evidence }}
        RDNA_CLUSTERER: ${{ inputs.clusterer }}
        RDNA_SEMANTIC_DOCS: ${{ inputs.semantic-docs }}
        RDNA_EMBEDDING_PROVIDER: ${{ inputs.embedding-provider }}
        RDNA_EMBEDDING_MODEL: ${{ inputs.embedding-model }}
        RDNA_EMBEDDING_URL: ${{ inputs.embedding-url }}
        RDNA_SEMANTIC_THRESHOLD: ${{ inputs.semantic-threshold }}
        RDNA_DOC_SEMANTIC_THRESHOLD: ${{ inputs.documentation-semantic-threshold }}
        RDNA_ESTIMATE_COST: ${{ inputs.estimate-cost }}
        RDNA_EMBEDDING_INPUT_PRICE: ${{ inputs.embedding-input-price-per-million }}
        RDNA_LLM_INPUT_PRICE: ${{ inputs.llm-input-price-per-million }}
        RDNA_LLM_OUTPUT_PRICE: ${{ inputs.llm-output-price-per-million }}
        RDNA_MAX_REMOTE_COST: ${{ inputs.max-remote-cost-usd }}
        RDNA_FAIL_ON_CHANGES: ${{ inputs.fail-on-changes }}
      run: |
        set -euo pipefail
        ARGS=(--max-prs "$RDNA_MAX_PRS" --min-evidence "$RDNA_MIN_EVIDENCE" --out "$RDNA_OUTPUT")
        if [ "$RDNA_REDACT" = "true" ]; then ARGS+=(--redact); fi
        if [ "$RDNA_REDACT_SENSITIVE" = "true" ]; then ARGS+=(--redact-sensitive); fi
        if [ "$RDNA_USE_CACHE" != "true" ]; then ARGS+=(--no-cache); fi
        if [ "$RDNA_RESUME" = "true" ]; then ARGS+=(--resume); fi
        if [ "$RDNA_USE_CHECKPOINTS" != "true" ]; then ARGS+=(--no-checkpoint); fi
        if [ "$RDNA_DEEP_EVIDENCE" = "true" ]; then ARGS+=(--deep-evidence); fi
        if [ "$RDNA_FAIL_ON_CHANGES" = "true" ]; then ARGS+=(--fail-on-changes); fi
        if [ "$RDNA_ESTIMATE_COST" = "true" ]; then ARGS+=(--estimate-cost); fi
        if [ -n "$RDNA_EMBEDDING_INPUT_PRICE" ]; then ARGS+=(--embedding-input-price-per-million "$RDNA_EMBEDDING_INPUT_PRICE"); fi
        if [ -n "$RDNA_LLM_INPUT_PRICE" ]; then ARGS+=(--llm-input-price-per-million "$RDNA_LLM_INPUT_PRICE"); fi
        if [ -n "$RDNA_LLM_OUTPUT_PRICE" ]; then ARGS+=(--llm-output-price-per-million "$RDNA_LLM_OUTPUT_PRICE"); fi
        if [ -n "$RDNA_MAX_REMOTE_COST" ]; then ARGS+=(--max-remote-cost-usd "$RDNA_MAX_REMOTE_COST"); fi

        USE_EMBEDDINGS="false"
        if [ "$RDNA_CLUSTERER" = "semantic" ]; then
          ARGS+=(--clusterer semantic)
          USE_EMBEDDINGS="true"
        elif [ "$RDNA_CLUSTERER" != "deterministic" ]; then
          echo "ReviewDNA Action error: clusterer must be deterministic or semantic" >&2
          exit 1
        fi
        if [ "$RDNA_SEMANTIC_DOCS" = "true" ]; then
          ARGS+=(--semantic-docs)
          USE_EMBEDDINGS="true"
        fi
        if [ "$USE_EMBEDDINGS" = "true" ]; then
          ARGS+=(--embedding-provider "$RDNA_EMBEDDING_PROVIDER")
          if [ -n "$RDNA_EMBEDDING_MODEL" ]; then ARGS+=(--embedding-model "$RDNA_EMBEDDING_MODEL"); fi
          if [ -n "$RDNA_EMBEDDING_URL" ]; then ARGS+=(--embedding-url "$RDNA_EMBEDDING_URL"); fi
          if [ -n "$RDNA_SEMANTIC_THRESHOLD" ]; then ARGS+=(--semantic-threshold "$RDNA_SEMANTIC_THRESHOLD"); fi
          if [ -n "$RDNA_DOC_SEMANTIC_THRESHOLD" ]; then ARGS+=(--documentation-semantic-threshold "$RDNA_DOC_SEMANTIC_THRESHOLD"); fi
        fi

        if [ "$RDNA_MODE" = "watch" ]; then
          node "${{ github.action_path }}/../apps/cli/dist/index.js" watch "$RDNA_REPOSITORY" "${ARGS[@]}" --baseline-file ".reviewdna/watch-baseline.json"
        elif [ "$RDNA_MODE" = "analyze" ]; then
          node "${{ github.action_path }}/../apps/cli/dist/index.js" analyze "$RDNA_REPOSITORY" "${ARGS[@]}"
        else
          echo "ReviewDNA Action error: mode must be analyze or watch" >&2
          exit 1
        fi
    - name: Upload ReviewDNA report
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output }}/
        if-no-files-found: warn
