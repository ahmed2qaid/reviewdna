name: ReviewDNA Analyze
description: Mine code-review history into evidence-backed engineering rules.
inputs:
  repository:
    description: Target repository in owner/name form
    required: true
  max-prs:
    description: Maximum merged pull requests to scan
    required: false
    default: '100'
  output:
    description: Output directory
    required: false
    default: reviewdna-output
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - shell: bash
      run: npm install --ignore-scripts && npm run build
      working-directory: ${{ github.action_path }}/..
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node "${{ github.action_path }}/../apps/cli/dist/index.js" analyze "${{ inputs.repository }}" --max-prs "${{ inputs.max-prs }}" --out "${{ inputs.output }}"
